[build-system]
requires = [ "setuptools>=84.0.0", "wheel",]
build-backend = "setuptools.build_meta"

[project]
name = "pulselink-mcp"
version = "2.3.7"
description = "PulseLink — keyless open-web & social research source (MCP Server)"
readme = "README.md"
classifiers = [ "Development Status :: 4 - Beta", "License :: OSI Approved :: MIT License", "Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3",]
requires-python = ">=3.12, <3.15"
dependencies = [ "scion-sdk[mcp]>=0.6.4,<0.7.0", "python-dotenv>=1.2.4", "requests>=2.34.2",]
[[project.authors]]
name = "Repository Maintainers"
email = "maintainers@knuckles.team"

[project.license]
text = "MIT"

[project.optional-dependencies]
mcp = [ "scion-sdk[mcp]>=0.6.4,<0.7.0",]
# Heavy / fragile transport deps stay OPTIONAL + lazy-imported (keyless-first):
# the keyless web/forum/news/dev sources need only `requests` (via scion-sdk).
youtube = [ "yt-dlp>=2026.8.19",]
feeds = [ "feedparser>=6.0.14",]
audio = [ "faster-whisper>=1.2.1",]
sources = [ "pulselink-mcp[youtube,feeds]>=2.3.5",]
all = [ "pulselink-mcp[mcp,youtube,feeds,audio]>=2.2.0",]
test = [
    "pytest-xdist>=3.8.0", "pytest>=9.1.1", "pytest-asyncio>=1.4.0", "pytest-cov>=7.1.0",
    "feedparser>=6.0.14", "yt-dlp>=2026.8.19",]

[project.scripts]
pulselink-mcp = "pulselink_mcp.mcp_server:mcp_server"

[project.entry-points."scion_sdk.prompt_providers"]
pulselink-mcp = "pulselink_mcp.prompts"

# The one declared connector identity: the fleet name (SCION-CONNECTOR-CONTROL-R071).
[project.entry-points."scion_sdk.connector"]
pulselink-mcp = "pulselink_mcp:connector"

[tool.uv.workspace]
members = ["."]

[tool.setuptools]
include-package-data = true

[tool.uv]
override-dependencies = [
    "fastmcp-slim[client,server]>=4.1.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true

[dependency-groups]
dev = [
    "bump2version>=1.0.1",
    "pytest-timeout>=2.4.0",
]

[tool.setuptools.package-data]
pulselink_mcp = [ "mcp_config.json", "prompts/**", "skills/**", "ontology/**", "connectors/**",]

[tool.ruff.lint]
select = [ "E", "F", "I", "UP", "B",]
ignore = [ "E402", "E501", "B008",]

[tool.setuptools.packages.find]
where = [ ".",]

[tool.vulture]
ignore_names = ["request", "config"]

[tool.pipelines_hooks.ste]
exempt = ["specs/*", "specs/**/*"]
