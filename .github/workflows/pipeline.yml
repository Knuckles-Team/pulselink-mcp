name: Build|Upload|Release Python Package

on:
  push:
    branches:
      - 'main'
    paths-ignore:
      - docker/Dockerfile
      - .github/workflows/container-release.yml
      - .bumpversion.cfg
      - specs/**/status.json

permissions:
  contents: read

jobs:
  publish-pypi:
    uses: Knuckles-Team/pipelines/.github/workflows/python_pipeline.yml@main
    permissions:
      contents: write
    secrets:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
